apiVersion: v1
kind: Service
metadata:
  name: ham-clickhouse-nodeport
  namespace: ham
spec:
  type: NodePort
  selector:
    clickhouse.com/role: clickhouse-server
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30803
    - name: tcp
      port: 9000
      targetPort: 9000
      nodePort: 30903
