---
apiVersion: v1
kind: ConfigMap
metadata:
  name: muc-keeper-config
  namespace: muc
data:
  keeper_config.xml: |
    <clickhouse>
      <keeper_server>
        <tcp_port>2181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse-keeper/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse-keeper/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
          <raft_logs_level>warning</raft_logs_level>
        </coordination_settings>
        <raft_configuration>
          <server>
            <id>1</id>
            <hostname>muc-keeper-0.muc-keeper.muc.svc.cluster.local</hostname>
            <port>9234</port>
          </server>
        </raft_configuration>
      </keeper_server>
      <logger>
        <level>warning</level>
        <console>1</console>
      </logger>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: muc-keeper
  namespace: muc
  labels:
    app: muc-keeper
spec:
  clusterIP: None
  selector:
    app: muc-keeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
    - name: raft
      port: 9234
      targetPort: 9234
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: muc-keeper
  namespace: muc
spec:
  serviceName: muc-keeper
  replicas: 1
  selector:
    matchLabels:
      app: muc-keeper
  template:
    metadata:
      labels:
        app: muc-keeper
    spec:
      containers:
        - name: keeper
          image: clickhouse/clickhouse-keeper:25.3
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 9234
              name: raft
          volumeMounts:
            - name: config
              mountPath: /etc/clickhouse-keeper/keeper_config.xml
              subPath: keeper_config.xml
            - name: data
              mountPath: /var/lib/clickhouse-keeper
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: muc-keeper-config
        - name: data
          emptyDir: {}
