apiVersion: v1
kind: Service
metadata:
  name: fra-clickhouse-nodeport
  namespace: fra
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: fra
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30801
    - name: tcp
      port: 9000
      targetPort: 9000
      nodePort: 30901
