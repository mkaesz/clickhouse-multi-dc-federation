apiVersion: v1
kind: Service
metadata:
  name: fra-clickhouse-nodeport
  namespace: fra
spec:
  type: NodePort
  selector:
    clickhouse.com/role: clickhouse-server
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30801
    - name: tcp
      port: 9000
      targetPort: 9000
      nodePort: 30901
    - name: tcp-secure
      port: 9440
      targetPort: 9440
      nodePort: 30941
      protocol: TCP
