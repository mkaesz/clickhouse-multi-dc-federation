# ClickHouse Helm chart values for DC: MUC
# Helm chart: clickhouse/clickhouse  (https://charts.clickhouse.com)
#
# Assumed pod naming (fullnameOverride=muc, shards=1, replicaCount=1):
#   StatefulSet:  muc-shard-0
#   Pod:          muc-shard-0-0
#   Headless svc: muc-headless
#   Pod FQDN:     muc-shard-0-0.muc-headless.muc.svc.cluster.local
#
# federated_dcs remote_servers are NOT included here. They are injected by
# poc/scripts/patch-federation.sh after node IPs are known.

fullnameOverride: muc

replicaCount: 1
shards: 1
clusterName: muc_local

image:
  repository: clickhouse/clickhouse-server
  tag: "latest"
  pullPolicy: IfNotPresent

keeper:
  enabled: false

auth:
  username: default
  password: ""

service:
  type: ClusterIP

macros:
  cluster: muc_local
  shard: "1"
  replica: muc-shard-0-0

persistence:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

extraConfigFiles:
  zookeeper.xml: |
    <clickhouse>
      <zookeeper>
        <node>
          <host>muc-keeper-0.muc-keeper.muc.svc.cluster.local</host>
          <port>2181</port>
        </node>
      </zookeeper>
    </clickhouse>

  remote_servers.xml: |
    <clickhouse>
      <remote_servers replace="1">
        <muc_local>
          <shard>
            <replica>
              <host>muc-shard-0-0.muc-headless.muc.svc.cluster.local</host>
              <port>9000</port>
            </replica>
          </shard>
        </muc_local>
      </remote_servers>
    </clickhouse>

  listen.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
    </clickhouse>

  users_network.xml: |
    <clickhouse>
      <users>
        <default>
          <networks>
            <ip>::/0</ip>
          </networks>
        </default>
      </users>
    </clickhouse>
