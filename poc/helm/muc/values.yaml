# ClickHouse Helm chart values for DC: MUC
# Helm chart: clickhouse/clickhouse  (https://charts.clickhouse.com)
#
# Pod naming produced by this chart with fullnameOverride=muc, shards=1:
#   StatefulSet: muc-shard-0
#   Pod:         muc-shard-0-0
#   Headless svc: muc-headless
#   FQDN:        muc-shard-0-0.muc-headless.muc.svc.cluster.local

fullnameOverride: muc

replicaCount: 1
shards: 1
clusterName: muc_local

image:
  repository: clickhouse/clickhouse-server
  tag: "25.3"
  pullPolicy: IfNotPresent

# Disable the chart's built-in keeper -- we deploy it externally
keeper:
  enabled: false

auth:
  username: default
  password: ""

service:
  type: ClusterIP

macros:
  cluster: muc_local
  shard: "1"
  replica: muc-shard-0-0

persistence:
  enabled: false

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

extraConfigFiles:
  zookeeper.xml: |
    <clickhouse>
      <zookeeper>
        <node>
          <host>muc-keeper-0.muc-keeper.muc.svc.cluster.local</host>
          <port>2181</port>
        </node>
      </zookeeper>
    </clickhouse>

  remote_servers.xml: |
    <clickhouse>
      <remote_servers replace="1">
        <muc_local>
          <shard>
            <replica>
              <host>muc-shard-0-0.muc-headless.muc.svc.cluster.local</host>
              <port>9000</port>
            </replica>
          </shard>
        </muc_local>

        <federated_dcs>
          <shard>
            <replica>
              <host>fra-shard-0-0.fra-headless.fra.svc.cluster.local</host>
              <port>9000</port>
            </replica>
          </shard>
          <shard>
            <replica>
              <host>muc-shard-0-0.muc-headless.muc.svc.cluster.local</host>
              <port>9000</port>
            </replica>
          </shard>
          <shard>
            <replica>
              <host>ham-shard-0-0.ham-headless.ham.svc.cluster.local</host>
              <port>9000</port>
            </replica>
          </shard>
        </federated_dcs>
      </remote_servers>
    </clickhouse>

  listen.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
    </clickhouse>

  users_network.xml: |
    <clickhouse>
      <users>
        <default>
          <networks>
            <ip>::/0</ip>
          </networks>
        </default>
      </users>
    </clickhouse>
